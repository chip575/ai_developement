services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academic_chat
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic_demo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_chat"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://academic:academic_demo@postgres:5432/academic_chat
    ports:
      - "127.0.0.1:${APP_PORT:-8771}:8765"
    volumes:
      - chroma_data:/app/data/chroma
      - model_data:/app/data/models
volumes:
  postgres_data:
  chroma_data:
  model_data:
